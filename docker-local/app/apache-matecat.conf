<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex router.php index.php

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Reverse-proxy the SSE/socket.io channel to the Node notification server (:7788).
    # Vhost-level rewrite runs before the per-dir .htaccess rules, so /sse/* is
    # proxied instead of being routed to router.php. Handles both the websocket
    # upgrade and the socket.io HTTP long-polling fallback. The /sse prefix is
    # stripped, so the node socket.io path must be /channel/updates/socket.io.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/sse/(.*)$ ws://sse:7788/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule ^/sse/(.*)$ http://sse:7788/$1 [P,L]
    ProxyPassReverse /sse/ http://sse:7788/

    LogLevel warn
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
